<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <script type="module" src="js/app.js"></script>
    <title>Tasky</title>
</head>

<body>
    <aside class="menu">
        <section class="user">
            <svg class="user-icon" width="100" height="100">
                <circle cx="50" cy="50" r="50" fill="#D9D9D9" />
            </svg>
            <h1 class="user-name">Nome do usuário</h1>
        </section>
        <hr>
        <section class="projects">
            <h1>Projetos:</h1>
            <ul class="projects-list">
                <li class="project"><img src="#" alt="icon" class="project-svg">
                    <h2 class="project-name">Projeto #1</h2>
                </li>
            </ul>
        </section>
        <section class="new-project">
            <button>+ Projeto</button>
        </section>
    </aside>
    <main class="kambam">
        <header>
            <div class="header-menu">
                <button class="open-menu">
                    <img src="assets/svg/menu.svg" alt="" class="open-menu-icon">
                </button>
                <h1>Projeto #1</h1>
            </div>
            <input type="text" class="search-task" name="task-search" id="task-search" placeholder="Pesquisar">
        </header>
        <div class="tasks">
            <section class="tasks-pending">
                <header>
                    <h2>Pendentes</h2>
                </header>
                <div class="pending-list">
                    <article class="task">
                        <h3 class="task-title">Tarefa #1</h3>
                        <hr>
                        <p class="task-description">Algumas linhas descrevendo as ações necessárias para a conclusão da
                            tarefa</p>
                        <p class="task-responsible">Responsável: Heitor Vieira</p>
                        <p class="task-schedule">Expira em: <time datetime="01/01/2027">01/01/2027</time></p>
                        <div class="task-priority">
                            <svg class="priority-icon" priority="high" height="50" width="50">
                                <circle cx="25" cy="25" r="25" />
                            </svg>
                            <p class="priority-title">Prioridade Alta</p>
                        </div>
                    </article>
                </div>
            </section>
            <section class="tasks-doing">
                <header>
                    <h2>Fazendo</h2>
                </header>
                <div class="doing-list">

                </div>
            </section>
            <section class="tasks-done">
                <header>
                    <h2>Finalizadas</h2>
                </header>
                <div class="done-list">

                </div>
            </section>
        </div>
        <button class="new-task" id="create-task">+ Nova Tarefa</button>
    </main>

    <dialog class="task-creation-modal" id="task-creation">
        <form class="task-creation" id="task-creation">
            <h1>Nova Tarefa:</h1>

            <hr>

            <div class="input-line">
                <label for="task-title">Título da Tarefa: *</label>
                <input type="text" name="task-title" id="task-title" placeholder="Informe o título da Tarefa" required>
            </div>

            <div class="input-line">
                <label for="task-description">Descrição da Tarefa:</label>
                <textarea name="task-description" id="task-descritpion" placeholder="Descreva a tarefa"></textarea>
            </div>

            <div class="input-line">
                <label for="task-responsible">Responsável: *</label>
                <input type="text" name="task-responsible" id="task-responsible" placeholder="Informe o responsável"
                    required>
            </div>

            <div class="input-line">
                <label for="task-schedule">Data de expiração: *</label>
                <input type="date" name="task-schedule" id="task-schedule" required>
            </div>

            <fieldset class="task-priority-input">
                <legend>Prioridade: *</legend>

                <ul>
                    <li>
                        <label for="low" class="priority-input">
                            <svg class="priority-icon" priority="low" height="50" width="50">
                                <circle cx="25" cy="25" r="25" />
                            </svg>
                            Baixa
                            <input type="radio" id="low" name="priority" value="low" checked hidden>
                        </label>
                    </li>
                    <li>
                        <label for="medium" class="priority-input">
                            <svg class="priority-icon" priority="medium" height="50" width="50">
                                <circle cx="25" cy="25" r="25" />
                            </svg>
                            Média
                            <input type="radio" id="medium" name="priority" value="medium" hidden>
                        </label>
                    </li>
                    <li>
                        <label for="high" class="priority-input">
                            <svg class="priority-icon" priority="high" height="50" width="50">
                                <circle cx="25" cy="25" r="25" />
                            </svg>
                            Alta
                            <input type="radio" id="high" name="priority" value="high" hidden>
                        </label>
                    </li>
                </ul>

            </fieldset>
            <div class="form-end">
                <button type="submit">Salvar</button>
            </div>
            <button class="close" type="button">X</button>
        </form>
    </dialog>
</body>

</html>
